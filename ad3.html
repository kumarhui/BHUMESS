<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hostel & Campus Updates | BHU JI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .card {
            width: 100%;
            max-width: 680px;
            overflow: hidden;
            border-radius: 24px;
            background: #ffffff;
            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.12),
                0 4px 12px rgba(15, 23, 42, 0.06);
        }

        .hero {
            padding: 48px 32px;
            color: white;
            background: linear-gradient(
                135deg,
                #D97706,
                #EA580C
            );
        }

        .badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 20px 0 12px;
            font-size: clamp(30px, 6vw, 48px);
            line-height: 1.08;
            letter-spacing: -0.03em;
        }

        .subtitle {
            margin: 0;
            max-width: 560px;
            font-size: 18px;
            line-height: 1.6;
            opacity: 0.92;
        }

        .content {
            padding: 32px;
        }

        .content p {
            margin: 0 0 24px;
            color: #475569;
            font-size: 16px;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 12px;
            color: white;
            background: #D97706;
            text-decoration: none;
            font-weight: 700;
        }

        .button:hover {
            opacity: 0.9;
        }

        .footer {
            padding: 0 32px 28px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 520px) {
            body {
                padding: 12px;
            }

            .hero {
                padding: 36px 24px;
            }

            .content {
                padding: 24px;
            }

            .footer {
                padding: 0 24px 24px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <section class="hero">

            <span class="badge">STUDENT</span>

            <h1>Hostel & Campus Updates</h1>

            <p class="subtitle">
                Latest notifications & hostel allocation news
            </p>

        </section>

        <section class="content">

            <p>
                Explore this student-focused BHU utility and get the
                information you need quickly and conveniently.
            </p>

            <a
                class="button"
                href="https://kumarhui.github.io/BHU_JI_v2/ad3.html"
            >
                Open Now
            </a>

        </section>

        <footer class="footer">
            BHU JI · Student Information Portal
        </footer>

    </main>

</body>
</html>
